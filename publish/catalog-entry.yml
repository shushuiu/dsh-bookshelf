# Drop this file into a fork of awesome-dsh-plugin as
#   data/plugins/shushuiu__dsh-bookshelf.yml
# (the file name and every URL below use your GitHub user name).
url: https://github.com/shushuiu/dsh-bookshelf      # must match the repo exactly
name: shushuiu/dsh-bookshelf                       # link text shown in the list
category: ui                                      # adds a 「书架」 page and panel to the Web UI
description:
  en: A Douban 想读 and 在读 shelf with covers and ratings, matched against a local ebook folder, with an in-panel EPUB/PDF/TXT reader and public-domain downloads.
  zh: 按豆瓣「想读」和「在读」书单排出的书架：封面与评分、与本地电子书自动配对，可在面板内阅读 EPUB/PDF/TXT，并支持公版书下载。
# optional — GitHub-hosted raster image used as the storefront tile
icon: https://raw.githubusercontent.com/shushuiu/dsh-bookshelf/main/assets/icon-180.png
# prebuilt tarball attached to the GitHub Release: storefronts offer it instead of
# the build-from-source command, so nobody needs an npm account to install.
tarball: https://github.com/shushuiu/dsh-bookshelf/releases/download/v1.0.0/dsh-bookshelf-1.0.0.tgz
